<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>天文恆星演化模擬器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            background: #0b0f19;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }

        .lab-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stage-view {
            flex: 1;
            background: #111827;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #1f2937;
        }

        .star {
            border-radius: 50%;
            transition: all 0.5s ease;
            box-shadow: 0 0 35px currentColor;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .filter-item {
            padding: 6px 12px;
            background: #374151;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-item.active {
            background: #3b82f6;
        }

        .controls {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border: 1px solid #1f2937;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.85rem;
        }

        .ai-panel {
            width: 380px;
            background: #111827;
            border-left: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }

        .ai-header {
            padding: 15px;
            background: #1f2937;
            font-weight: bold;
            border-bottom: 1px solid #374151;
        }

        .ai-hint {
            padding: 10px 15px;
            background: #1e1b4b;
            color: #a5b4fc;
            font-size: 0.85rem;
            border-bottom: 1px solid #312e81;
        }

        /* 💡 聊天框直式滑桿與高度固定機制 */
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #111827;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }

        .msg {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg.user {
            background: #2563eb;
            align-self: flex-end;
            max-width: 85%;
        }

        .msg.assistant {
            background: #374151;
            align-self: flex-start;
            max-width: 90%;
            white-space: pre-wrap;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }

        .chat-input-area button {
            padding: 8px 16px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="lab-container">
        <div class="stage-view">
            <span id="stage-badge"
                style="position: absolute; top: 15px; left: 15px; background: #374151; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;">載入中...</span>
            <div id="starVisual" class="star" style="width: 60px; height: 60px; background-color: #ffcc66;"></div>
            <div class="filters">
                <div class="filter-item active" onclick="setFilter(this, 'visible')">可見光</div>
                <div class="filter-item" onclick="setFilter(this, 'xray')">X射線</div>
                <div class="filter-item" onclick="setFilter(this, 'infrared')">紅外線</div>
            </div>
            <div id="starMetrics" style="margin-top: 15px; font-size: 0.85rem; color: #9ca3af;"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>質量 (M☉): <span id="val-mass">1.0</span></label>
                <input type="range" id="slider-mass" min="0.1" max="50" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>金屬量 (Z☉): <span id="val-metal">1.0</span></label>
                <input type="range" id="slider-metal" min="0.0" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="control-group">
                <label>自轉速率: <span id="val-rot">0.0</span></label>
                <input type="range" id="slider-rot" min="0.0" max="1.0" step="0.05" value="0.0">
            </div>
            <div class="control-group">
                <label>演化時間 (Gyr): <span id="val-age">4.6</span></label>
                <input type="range" id="slider-age" min="0.01" max="13.8" step="0.1" value="4.6">
            </div>
        </div>
    </div>

    <div class="ai-panel">
        <div class="ai-header">🤖 天文 AI 助理</div>
        <div id="aiHintText" class="ai-hint">💡 調整參數可觀測恆星演化過程！</div>

        <div class="chat-box" id="chatBox">
            <div class="msg assistant">你好！我是你的天文小助手，歡迎隨時提問。</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="請輸入問題..." onkeydown="if(event.key==='Enter') sendQuestion()">
            <button onclick="sendQuestion()">發送</button>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let currentSessionId = null;
        let debounceTimer = null;
        let activeFilter = 'visible';

        async function initSession() {
            try {
                const res = await fetch(`${API_BASE}/api/chat/session`, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') currentSessionId = data.session_id;
            } catch (err) { console.error("Session 建立失敗", err); }
        }
        initSession();

        function setFilter(el, filterType) {
            document.querySelectorAll('.filter-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            activeFilter = filterType;
            triggerEvolve(false);
        }

        const massInput = document.getElementById('slider-mass');
        const metalInput = document.getElementById('slider-metal');
        const rotInput = document.getElementById('slider-rot');
        const ageInput = document.getElementById('slider-age');

        [massInput, metalInput, rotInput, ageInput].forEach(slider => {
            slider.addEventListener('input', () => {
                updateUIValues();
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => triggerEvolve(true), 600);
            });
        });

        function updateUIValues() {
            document.getElementById('val-mass').innerText = `${parseFloat(massInput.value).toFixed(1)} M☉`;
            document.getElementById('val-metal').innerText = `${parseFloat(metalInput.value).toFixed(1)} Z☉`;
            document.getElementById('val-rot').innerText = `${parseFloat(rotInput.value).toFixed(2)}`;
            document.getElementById('val-age').innerText = `${parseFloat(ageInput.value).toFixed(1)} Gyr`;
        }

        async function triggerEvolve(fetchAiHint = true) {
            const payload = {
                user_id: "demo_user",
                mass: parseFloat(massInput.value),
                metallicity: parseFloat(metalInput.value),
                rotation: parseFloat(rotInput.value),
                age_gyr: parseFloat(ageInput.value),
                with_hint: fetchAiHint
            };

            try {
                const res = await fetch(`${API_BASE}/api/star/evolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const responseData = await res.json();

                if (responseData.status === 'success') {
                    updateSimulationView(responseData.data);
                    if (responseData.hint) {
                        document.getElementById('aiHintText').innerText = responseData.hint;
                    }
                }
            } catch (err) { console.error("演化計算失敗", err); }
        }

        function updateSimulationView(data) {
            const visual = document.getElementById('starVisual');
            document.getElementById('stage-badge').innerText = data.stage_name;

            let displayColor = data.current_color ? data.current_color.hex : "#333333";
            if (activeFilter === 'xray') displayColor = '#c084fc';
            else if (activeFilter === 'infrared') displayColor = '#f87171';

            visual.style.backgroundColor = displayColor;
            visual.style.color = displayColor;

            let radius = data.current_radius_solar || 0.1;
            let size = Math.min(Math.max(radius * 40, 15), 180);
            visual.style.width = `${size}px`;
            visual.style.height = `${size}px`;
            visual.style.transform = `scaleY(${1 - (data.oblateness || 0)})`;

            const temp = data.current_temperature_k ? `${data.current_temperature_k} K` : '無/極低';
            const lum = data.current_luminosity_solar !== null ? `${data.current_luminosity_solar} L☉` : '無';
            document.getElementById('starMetrics').innerText =
                `溫度: ${temp} | 半徑: ${radius} R☉ | 光度: ${lum}`;
        }

        async function sendQuestion() {
            const input = document.getElementById('userInput');
            const userQuery = input.value.trim();
            if (!userQuery) return;

            const chatBox = document.getElementById('chatBox');

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'msg user';
            userMsgDiv.innerText = userQuery;
            chatBox.appendChild(userMsgDiv);
            input.value = '';

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'msg assistant';
            aiMsgDiv.innerText = "思考中...";
            chatBox.appendChild(aiMsgDiv);

            chatBox.scrollTop = chatBox.scrollHeight;

            const fullPrompt = `[使用者正在觀測：質量 ${massInput.value} M☉, 年齡 ${ageInput.value} Gyr] ${userQuery}`;

            try {
                const response = await fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: fullPrompt,
                        session_id: currentSessionId,
                        top_k: 3
                    })
                });

                if (!response.ok) {
                    aiMsgDiv.innerText = "⚠️ 伺服器狀態異常，請稍後再試。";
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith("data: ")) {
                            const data = trimmed.replace("data: ", "").trim();
                            if (data === "[DONE]") break;

                            if (isFirstChunk) {
                                aiMsgDiv.innerText = "";
                                isFirstChunk = false;
                            }

                            aiMsgDiv.innerText += data;
                            chatBox.scrollTop = chatBox.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                aiMsgDiv.innerText = "⚠️ 連線失敗，請檢查網路狀況。";
            }
        }

        updateUIValues();
        triggerEvolve(false);
    </script>
</body>

</html>
