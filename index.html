<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Galaxy Simulator 3D</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="pane on">
    <div class="sec">核心物理參數</div>

    <div class="row">
      <div class="lbl">星系質量 <b id="v-logM">12.5</b></div>
      <input type="range" id="logM" min="10" max="15" step="0.1" value="12.5">
    </div>

    <div class="row">
      <div class="lbl">盤半徑 <b id="v-rd">3.5</b> kpc</div>
      <input type="range" id="rd" min="0.5" max="12" step="0.5" value="3.5">
    </div>

    <div class="row">
      <div class="lbl">恆星形成 <b id="v-sfr">0.5</b></div>
      <input type="range" id="sfr" min="-2" max="3" step="0.1" value="0.5">
    </div>

    <div class="row">
      <div class="lbl">傾斜角 <b id="v-incl">25</b>°</div>
      <input type="range" id="incl" min="0" max="90" step="1" value="25">
    </div>

    <button onclick="simulate()">▶ 更新星系</button>
  </div>
</div>

<div id="hud">左鍵旋轉 · 右鍵平移 · 滾輪縮放 | <span id="hud-info">載入中...</span></div>
<script src="vendor/three.min.js"></script>
<script src="js/params.js"></script>
<script src="js/helpers.js"></script>
<script src="js/physics.js"></script>
<script src="js/renderer.js"></script>
<script src="js/galaxy_builder.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
