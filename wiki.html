    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        const trailParticles = [];
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                trailParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: Math.random() * 2 + 1,
                    alpha: 0.8,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            }
        });

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                let tp = trailParticles[i];
                ctx.globalAlpha = tp.alpha;
                ctx.fillStyle = '#818cf8';
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, tp.radius, 0, Math.PI * 2);
                ctx.fill();

                tp.x += tp.vx;
                tp.y += tp.vy;
                tp.alpha -= 0.03;

                if (tp.alpha <= 0) {
                    trailParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateSpace);
        }
        animateSpace();
    </script>

                const matchCat = currentCategory === 'all' || item.cat === currentCategory;
                const matchQuery = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderWiki(filtered);
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent = item.name;
            document.getElementById('detailBody').innerHTML = `
                <p><b>分類標籤：</b>${item.tag}</p><br>
                <p><b>詳細解析：</b>${item.desc}</p>
            `;
            document.getElementById('mediaPhotoContainer').innerHTML = `📷 <b>${item.imgText}</b><br><span style="font-size: 0.7rem; color: var(--text-muted);">(可於此處嵌入專題圖片或 Blender 截圖)</span>`;
        }

        renderWiki(wikiData);
    </script>
</body>
</html>
