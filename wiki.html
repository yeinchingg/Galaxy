    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        const trailParticles = [];
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                trailParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: Math.random() * 2 + 1,
                    alpha: 0.8,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            }
        });

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                let tp = trailParticles[i];
                ctx.globalAlpha = tp.alpha;
                ctx.fillStyle = '#818cf8';
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, tp.radius, 0, Math.PI * 2);
                ctx.fill();

                tp.x += tp.vx;
                tp.y += tp.vy;
                tp.alpha -= 0.03;

                if (tp.alpha <= 0) {
                    trailParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateSpace);
        }
        animateSpace();
    </script>

            { id: 27, cat: 'stellar', name: '紅巨星 / 巨星 (Red Giant / Giant)', tag: '恆星演化階段', desc: '中低質量恆星核心氫耗盡後膨脹形成的巨型恆星，表面溫度較低而呈現紅色。' },
            { id: 28, cat: 'stellar', name: '紅超巨星 / 超巨星 (Red Supergiant)', tag: '恆星演化階段', desc: '大質量恆星演化晚期的極度膨脹狀態，半徑可達數個天文單位，核心能進行多重元素融合直到生成鐵。' },
            { id: 29, cat: 'stellar', name: '白矮星 (White Dwarf)', tag: '恆星殘骸／緻密星', desc: '中低質量恆星拋散外層後留下的高密度核心殘骸，依靠電子簡併壓抗衡重力。' },
            { id: 30, cat: 'stellar', name: '黑矮星 (Black Dwarf)', tag: '恆星殘骸理論終局', desc: '白矮星將所有內部殘餘熱能輻射殆盡後，不再發光冷卻形成的最終冷卻天體殘骸。' },
            { id: 31, cat: 'stellar', name: '中子星 (Neutron Star)', tag: '恆星殘骸／緻密星', desc: '大質量恆星超新星爆炸後形成的極高密度殘骸，直徑僅約 20 公里，依靠中子簡併壓對抗重力。' },
            { id: 32, cat: 'stellar', name: '脈衝星 (Pulsar)', tag: '緻密星特徵', desc: '高速自轉且具備強烈磁場的中子星，向外發出週期性電波脈衝訊號。' },
            { id: 33, cat: 'stellar', name: '磁星 (Magnetar)', tag: '緻密星特徵', desc: '擁有超強磁場的中子星，外殼破裂引發星震時會釋放巨大伽瑪射線與 X 射線暴發。' },
            { id: 34, cat: 'stellar', name: '棕矮星 (Brown Dwarf)', tag: '失敗的恆星', desc: '質量介於最大氣態行星與最小恆星之間的天體，核心不足以點燃穩定的氫融合。' },
            { id: 35, cat: 'stellar', name: 'T 金牛座型星 (T Tauri Star)', tag: '恆星演化階段', desc: '中低質量原恆星即將進入主序帶之前的演化階段，展現強烈恆星風與吸積盤。' },
            { id: 36, cat: 'stellar', name: '造父變星 (Cepheid Variables)', tag: '變星類型／標準燭光', desc: '脈動週期與真實光度成正比的黃色超巨星，是量測河外星系距離的核心標準燭光。' },
            { id: 37, cat: 'stellar', name: 'RR 琴座型變星 (RR Lyrae Variables)', tag: '變星類型／標準燭光', desc: '週期小於 1 天的年老脈動巨星，常用於測量銀河系內及近鄰星系距離。' },
            { id: 38, cat: 'stellar', name: '比鄰星 (Proxima Centauri)', tag: '特定恆星／紅矮星', desc: '距離太陽系最近的恆星（約 4.25 光年），屬於 M 型低光度紅矮星。' },
            { id: 39, cat: 'stellar', name: '半人馬座 α 星 (Alpha Centauri A/B)', tag: '特定恆星／聯星系統', desc: '距離太陽系最近的聯星系統（約 4.4 光年），包含 G 型與 K 型主序星。' },
            { id: 40, cat: 'stellar', name: '天狼星 A 與天狼星 B', tag: '特定恆星／聯星系統', desc: '全天肉眼最明亮的主序星天狼星 A，與人類歷史首顆發現的白矮星伴星 B 組成。' },
            { id: 41, cat: 'stellar', name: '織女星與牛郎星', tag: '特定恆星', desc: '織女星為琴座 A 型主序星；牛郎星為天鷹座高速自轉星，夏季大三角成員。' },
            { id: 42, cat: 'stellar', name: '參宿四與參宿七', tag: '特定恆星／獵戶座', desc: '獵戶座亮星。參宿四為紅超巨星；參宿七為極度明亮的藍超巨星。' },
            { id: 43, cat: 'stellar', name: '北極星 (Polaris)', tag: '特定恆星 / 造父變星', desc: '小熊座最亮星，同時也是一顆脈動振幅逐漸減小的造父變星。' },
            { id: 44, cat: "stellar", name: "巴納德星 (Barnard's Star)", tag: '特定恆星／紅矮星', desc: '全天已知自行速度最大的恆星，距離地球較近的低質量紅矮星。' },
            { id: 45, cat: 'stellar', name: '大陵五 / 惡魔星 (Algol)', tag: '特定恆星／食雙星', desc: '英仙座最著名的食雙星，亮度會週期性因為兩星相互遮擋而變暗。' },
            { id: 46, cat: 'stellar', name: '心宿二 (Antares)', tag: '特定恆星／紅超巨星', desc: '天蠍座核心的紅超巨星，周圍環繞著自身拋射物質組成的反射塵埃雲。' },

            // 🌌 3. 星系、黑洞、星雲與大尺度結構
            { id: 47, cat: 'galaxies', name: '銀河系 (Milky Way Galaxy)', tag: '星系類型／棒旋星系', desc: '我們太陽系所在的家鄉星系，直徑超過 10 萬光年，包含 2000 億至 4000 億顆恆星，中心擁有超大質量黑洞人馬座 A*。' },
            { id: 48, cat: 'galaxies', name: '螺旋星系 / 棒旋星系', tag: '星系形態分類', desc: '具有中央核球、扁平星盤與旋臂結構的星系，旋臂中富含氣體與塵埃，新恆星形成活躍。' },
            { id: 49, cat: 'galaxies', name: '橢圓星系 (Elliptical Galaxy)', tag: '星系形態分類', desc: '外觀呈圓球或橢球狀的星系，主要由年老紅色的第二星族星組成，內部幾乎沒有氣體與塵埃。' },
            { id: 50, cat: 'galaxies', name: '不規則星系 (Irregular Galaxy)', tag: '星系形態分類', desc: '缺乏對稱或固定幾何形狀的星系，通常質量較小且富含氣體塵埃（如大、小麥哲倫星雲）。' },
            { id: 51, cat: 'galaxies', name: '矮星系 (Dwarf Galaxy)', tag: '星系規模分類', desc: '規模遠小於標準星系的微型星系，常作為大型星系的衛星星系被重力吞噬。' },
            { id: 52, cat: 'galaxies', name: '仙女座星系 (Andromeda / M31)', tag: '特定星系／螺旋星系', desc: '本星系群中規模最大的螺旋星系，距離地球約 250 萬光年，預計在 45 億年後與銀河系碰撞。' },
            { id: 53, cat: 'galaxies', name: '三角座星系 (Triangulum / M33)', tag: '特定星系／螺旋星系', desc: '本星系群中第三大的螺旋星系，規模僅次於仙女座星系與銀河系。' },
            { id: 54, cat: 'galaxies', name: '大麥哲倫星雲 (LMC) 與 小麥哲倫星雲', tag: '特定星系／不規則矮星系', desc: '銀河系最近的兩個不規則伴星系（距離約 16 萬光年），南半球肉眼可見。' },
            { id: 55, cat: 'galaxies', name: '本星系群 (Local Group)', tag: '星系大尺度結構／星系群', desc: '包含銀河系、仙女座星系及約 60 個矮星系的重力束縛星系群。' },
            { id: 56, cat: 'galaxies', name: '室女座星系團與后髮座星系團', tag: '星系大尺度結構／星系團', desc: '室女座星系團包含數千個星系；后髮座星系團距離約 3 億光年，茲威基曾在此首度發現暗物質證據。' },
            { id: 57, cat: 'galaxies', name: '室女座超星系團 與 拉尼亞凱亞超星系團', tag: '星系大尺度結構／超星系團', desc: '本星系群所在的超星系團結構，拉尼亞凱亞為更高階的超星系團。' },
            { id: 58, cat: 'galaxies', name: '宇宙網與空洞 (Cosmic Web & Voids)', tag: '宇宙大尺度結構', desc: '宇宙中的星系與星系團在超大尺度上交織成的絲狀結構，其間分布著巨大黑暗空洞。' },
            { id: 59, cat: 'galaxies', name: '黑洞 (Black Hole)', tag: '緻密天體／極端時空', desc: '大量物質被壓縮至極小空間內所形成的高密度天體，其強大重力使逃逸速度超過光速。' },
            { id: 60, cat: 'galaxies', name: '事件視界 (Event Horizon)', tag: '黑洞結構', desc: '黑洞周圍單向只進不出的臨界面邊界，內部訊號無法傳遞至外部宇宙。' },
            { id: 61, cat: 'galaxies', name: '史瓦西半徑 (Schwarzschild Radius)', tag: '黑洞物理參數', desc: '球對稱無自轉黑洞的事件視界半徑（r_s = 2GM/c^2）。' },
            { id: 62, cat: 'galaxies', name: '奇點 (Singularity)', tag: '黑洞物理結構', desc: '物質在黑洞中心被重力無限壓縮至體積為零、密度無限大的點。' },
            { id: 63, cat: 'galaxies', name: '吸積盤 (Accretion Disk)', tag: '天體物理現象', desc: '氣體與塵埃落入黑洞時因角動量在四周形成的旋轉盤狀結構，摩擦生熱可達數百萬度。' },
            { id: 64, cat: 'galaxies', name: '義大利麵化 (Spaghettification)', tag: '黑洞潮汐力現象', desc: '物體靠近黑洞時因極端潮汐力差而被縱向拉長、橫向擠壓的現象。' },
            { id: 65, cat: 'galaxies', name: '超大質量黑洞 (Supermassive Black Hole)', tag: '黑洞分類', desc: '質量達太陽數十萬倍至數百億倍的巨型黑洞，普遍存在於大型星系核心。' },
            { id: 66, cat: 'galaxies', name: '人馬座 A* (Sagittarius A*)', tag: '特定黑洞／超大質量黑洞', desc: '位於銀河系中心的超大質量黑洞，質量約為 400 萬倍太陽質量。' },
            { id: 67, cat: 'galaxies', name: '天鵝座 X-1 (Cygnus X-1)', tag: '特定黑洞／恆星黑洞', desc: '人類歷史上記錄的第一個恆星級黑洞候選天體，伴隨強烈 X 射線輻射。' },
            { id: 68, cat: 'galaxies', name: 'TON 618', tag: '特定黑洞／極大質量黑洞', desc: '目前人類觀測到質量最大的黑洞之一，質量高達太陽的 660 億倍。' },
            { id: 69, cat: 'galaxies', name: 'M87 中心黑洞 (M87*)', tag: '特定黑洞／超大質量黑洞', desc: '2019 年由 EHT 拍下人類史上第一張黑洞事件視界陰影的巨星系黑洞。' },
            { id: 70, cat: 'galaxies', name: '分子雲 (Molecular Cloud)', tag: '星際介質／恆星苗圃', desc: '跨越數百光年、溫度極低且富含分子態氫與塵埃的巨大星際氣體雲。' },
            { id: 71, cat: 'galaxies', name: '發射星雲 / H II 區 (Emission Nebula)', tag: '星雲類型', desc: '被高溫年輕恆星紫外光電離的電離氫氣體雲，電子複合時發出紅色螢光。' },
            { id: 72, cat: 'galaxies', name: '反射星雲 (Reflection Nebula)', tag: '星雲類型', desc: '光線被周圍微小星際塵埃粒子散射而發光的雲氣，因藍光散射率高而呈藍色。' },
            { id: 73, cat: 'galaxies', name: '暗星雲 (Dark Nebula)', tag: '星雲類型', desc: '高密度的星際塵埃雲，遮擋背後遠方星光，在天空中呈現漆黑剪影。' },
            { id: 74, cat: 'galaxies', name: '行星狀星雲 (Planetary Nebula)', tag: '恆星演化殘骸', desc: '中低質量恆星晚期拋散出的擴張氣體殼層，中央留下一顆極熱白矮星。' },
            { id: 75, cat: 'galaxies', name: '獵戶座大星雲 (Orion Nebula / M42)', tag: '特定星雲／恆星苗圃', desc: '距離地球約 1300 光年、肉眼可見的著名恆星形成區。' },
            { id: 76, cat: 'galaxies', name: '蟹狀星雲 (Crab Nebula / M1)', tag: '超新星殘骸', desc: '1054 年超新星爆炸留下的高能擴張殘骸，中心包含一顆脈衝星。' },
            { id: 77, cat: 'galaxies', name: '馬頭星雲 (Horsehead Nebula)', tag: '特定暗星雲', desc: '位於獵戶座、形狀極似馬頭的著名暗星雲。' },
            { id: 78, cat: 'galaxies', name: '類星體 / 活動星系核 (Quasar / AGN)', tag: '極端天體／活動星系', desc: '早期宇宙中由中心超大質量黑洞劇烈吸積物質產生極高光度的外河外天體。' },

            // ⏳ 4. 物理定律、天體力學與宇宙學
            { id: 101, cat: 'physics', name: "牛頓萬有引力定律", tag: '經典物理定律', desc: '宇宙中任意兩質點相互吸引，引力大小與質量乘積成正比、與距離平方成反比。' },
            { id: 102, cat: 'physics', name: '四大基本作用力', tag: '基礎物理學', desc: '重力、電磁力、強核力與弱核力，塑造宇宙一切交互作用。' },
            { id: 103, cat: 'physics', name: '克卜勒行星運動三大定律', tag: '天體力學定律', desc: '橢圓定律、面積定律與週期定律，精確描述行星運行軌跡。' },
            { id: 104, cat: 'physics', name: '活力公式 (Vis-Viva Equation)', tag: '天體力學公式', desc: '描述天體在軌道上任一點機械能守恆的公式。' },
            { id: 105, cat: 'physics', name: '逃逸速度 (Escape Velocity)', tag: '天體力學概念', desc: '天體克服某一重力場束縛所需的最小初始速度。' },
            { id: 106, cat: 'physics', name: '軌道根數 (Orbital Elements)', tag: '天體力學參數', desc: '完整描述天體三維克卜勒軌道姿態與位置所需的六個獨立參數。' },
            { id: 107, cat: 'physics', name: '霍曼轉移軌道與重力助推', tag: '航天軌道力學', desc: '最省燃料的切向橢圓轉移與借力加速技術。' },
            { id: 108, cat: 'physics', name: '廣義相對論與重力波', tag: '現代物理學與相對論', desc: '重力為時空彎曲幾何效應；天體加速會產生光速傳播的重力波漣漪。' },
            { id: 109, cat: 'physics', name: '重力透鏡 (Gravitational Lensing)', tag: '相對論現象', desc: '大質量天體強大重力彎曲背景光線，造成影像放大或扭曲。' },
            { id: 110, cat: 'physics', name: '電子簡併壓與錢德拉塞卡極限', tag: '量子物理／恆星演化', desc: '支撐白矮星的量子力學壓力，極限約為 1.4 倍太陽質量。' },
            { id: 111, cat: 'physics', name: '中子簡併壓 (Neutron Degeneracy Pressure)', tag: '量子物理／恆星演化', desc: '超越錢德拉塞卡極限後支撐中子星的量子簡併壓力。' },
            { id: 112, cat: 'physics', name: '赫羅圖 (H-R Diagram)', tag: '恆星天文學工具', desc: '表面溫度對絕對光度的散布圖，天文學的元素週期表。' },
            { id: 113, cat: 'physics', name: '視差、秒差距與星等', tag: '天文測量學', desc: '三角視差法定義距離；視星等與絕對星等代表明暗與真實發光度。' },
            { id: 114, cat: 'physics', name: '都卜勒效應、紅移與哈伯定律', tag: '光譜學與宇宙學', desc: '光譜藍移紅移現象；哈伯定律證明宇宙空間正在均勻膨脹。' },
            { id: 115, cat: 'physics', name: '暗物質與暗能量', tag: '宇宙學成分', desc: '暗物質佔 26.8%；暗能量驅使宇宙加速膨脹佔 68.5%。' },
            { id: 116, cat: 'physics', name: '大霹靂、微波背景與宇宙暴脹', tag: '宇宙學創生模型', desc: '138 億年前宇宙創生事件；CMB 為殘餘輝光；暴脹解釋平坦性。' },
            { id: 117, cat: 'physics', name: '德雷克方程式與費米悖論', tag: '天體生物學', desc: '估算銀河系智慧文明數量與探討外星文明蹤跡的命題。' },

            // 🔭 5. 觀測儀器、天文台與太空任務 (新增完整 11 筆資料)
            { id: 301, cat: 'missions', name: '哈伯太空望遠鏡 (HST)', tag: '太空望遠鏡', desc: '1990 年發射、口徑 2.4 公尺的近地軌道太空望遠鏡，觀測波段涵蓋紫外、可見光與近紅外光。曾進行超新星距離量測（證實宇宙加速膨脹）、拍攝深空場等重大突破。' },
            { id: 302, cat: 'missions', name: '韋伯太空望遠鏡 (JWST)', tag: '太空望遠鏡', desc: '2021 年發射、主鏡口徑 6.5 公尺（18 片鍍金六角形鏡片）的紅外線太空望遠鏡，運行於 L2 軌道，專為觀測早期宇宙高紅移星系與系外行星大氣設計。' },
            { id: 303, cat: 'missions', name: '事件視界望遠鏡 (EHT)', tag: '地面電波干涉陣列', desc: '結合全球多座電波望遠鏡進行「特長基線干涉技術」（VLBI）形成的地球口徑虛擬電波望遠鏡，於 2019 與 2022 年拍下 M87* 與銀河系中心黑洞陰影。' },
            { id: 304, cat: 'missions', name: '雷射干涉重力波天文台 (LIGO)', tag: '重力波偵測器', desc: '位於美國的重力波偵測站，利用 4 公里長 L 型臂進行雷射干涉，於 2015 年首次直接偵測到雙黑洞合併產生的重力波。' },
            { id: 305, cat: 'missions', name: '蓋亞衛星與依巴谷衛星', tag: '測天衛星', desc: '依巴谷衛星首次從太空精確量測數萬恆星視差；蓋亞衛星則精確測量超過 10 億顆恆星的三維位置與視差，繪製銀河系三維地圖。' },
            { id: 306, cat: 'missions', name: 'COBE、WMAP 與 普朗克衛星', tag: '宇宙微波背景探測衛星', desc: 'NASA 與 ESA 的三大 CMB 探測任務，精確測繪宇宙微波背景角功率譜，確立了宇宙年齡（138 億年）與質能組成。' },
            { id: 307, cat: 'missions', name: '開普勒太空望遠鏡與 TESS 衛星', tag: '系外行星搜尋衛星', desc: '利用「凌日法」搜尋系外行星。開普勒發現數千顆系外行星；TESS 則進行全天近鄰亮星的凌日巡天。' },
            { id: 308, cat: 'missions', name: '史隆數位巡天 (SDSS)', tag: '大規模天體巡天計畫', desc: '利用阿帕契點天文台 2.5 公尺望遠鏡與光纖光譜儀記錄數億天體與數百萬星系光譜，繪製三維宇宙大尺度結構。' },
            { id: 309, cat: 'missions', name: '航海家 1 號/2 號與先鋒 10 號/11 號', tag: '深空行星際探測器', desc: '人類發射飛離太陽系的深空探測器，航海家號攜帶錄有地球影像與聲音的「黃金唱片」航向星際空間。' },
            { id: 310, cat: 'missions', name: '帕克太陽探測器 (Parker Solar Probe)', tag: '太陽物理探測器', desc: 'NASA 於 2018 年發射的太陽探測器，直接穿越太陽外層日冕大氣，實地測量太陽風與磁場結構。' },
            { id: 311, cat: 'missions', name: 'ALMA 與 甚大天線陣 (VLA)', tag: '地面大型電波望遠鏡陣列', desc: 'ALMA 位於智利高山，擅長觀測原行星盤結構（如 HL Tau）；VLA 位於美國新墨西哥州，用於高解析度電波天體成像。' }
        ];

        let currentCategory = 'all';

        function renderWiki(data) {
            const grid = document.getElementById('wikiGrid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-muted); padding: 20px;">沒有找到相關名詞</div>';
                return;
            }
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wiki-card';
                card.onclick = () => showDetail(item);
                card.innerHTML = `
                    <div class="wiki-card-title">${item.name}</div>
                    <div class="wiki-card-tag">${item.tag}</div>
                    <div class="wiki-card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = wikiData.filter(item => {
                const matchCat = currentCategory === 'all' || item.cat === currentCategory;
                const matchQuery = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderWiki(filtered);
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent = item.name;
            document.getElementById('detailBody').innerHTML = `
                <p><b>分類標籤：</b>${item.tag}</p><br>
                <p><b>詳細解析：</b>${item.desc}</p>
            `;
        }

        renderWiki(wikiData);
    </script>
</body>
</html>
