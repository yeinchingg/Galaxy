    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        const trailParticles = [];
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                trailParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: Math.random() * 2 + 1,
                    alpha: 0.8,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            }
        });

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                let tp = trailParticles[i];
                ctx.globalAlpha = tp.alpha;
                ctx.fillStyle = '#818cf8';
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, tp.radius, 0, Math.PI * 2);
                ctx.fill();

                tp.x += tp.vx;
                tp.y += tp.vy;
                tp.alpha -= 0.03;

                if (tp.alpha <= 0) {
                    trailParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateSpace);
        }
        animateSpace();
    </script>

            { id: 24, cat: 'stellar', name: '原恆星 (Protostar)', tag: '恆星演化階段', desc: '恆星誕生的「嬰兒」階段。當巨大分子雲中的高密度團塊在自身重力下塌縮生熱，尚未點燃核心氫融合反應前稱為原恆星，能量主要來自重力位能釋放。' },
            { id: 25, cat: 'stellar', name: '主序星 (Main-Sequence Star)', tag: '恆星演化階段', desc: '恆星一生中最漫長且穩定的青壯年時期（約佔生命的 90%）。在此階段，恆星核心穩定地進行氫融合為氦的反應，產生的向外輻射壓與向內的重力吸引力達到完美的流體靜力平衡。' },
            { id: 26, cat: 'stellar', name: '次巨星 (Subgiant)', tag: '恆星演化階段', desc: '核心氫燃料耗盡後，恆星離開主序帶、外層大氣開始膨脹且光度上升，介於主序星與紅巨星之間的過渡階段。' },
            { id: 27, cat: 'stellar', name: '紅巨星 / 巨星 (Red Giant / Giant)', tag: '恆星演化階段', desc: '中低質量恆星（小於約 8 倍太陽質量）在核心的氫燃料耗盡後，核心收縮升溫，外層大氣劇烈膨脹與冷卻所形成的巨型恆星。核心後續會點燃 3氦過程（Triple-Alpha）將氦融合成碳與氧，表面溫度較低而呈現紅色。' },
            { id: 28, cat: 'stellar', name: '紅超巨星 / 超巨星 (Red Supergiant / Supergiant)', tag: '恆星演化階段', desc: '大質量恆星（大於約 8–10 倍太陽質量）演化晚期的極度膨脹狀態。其體積極其龐大（半徑可達數個 AU），核心能依次進行碳、氧、氖、鎂至矽融合，直到生成鐵核心。' },
            { id: 29, cat: 'stellar', name: '白矮星 (White Dwarf)', tag: '恆星殘骸／緻密星', desc: '中低質量恆星拋散行星狀星雲後留下的極高密度核心殘骸，體積與地球相當但質量與太陽相當。內部不再進行核融合，完全依靠電子簡併壓抗衡重力。' },
            { id: 30, cat: 'stellar', name: '黑矮星 (Black Dwarf)', tag: '恆星殘骸理論終局', desc: '白矮星在經過數百億甚至數兆年的漫長歲月將所有內部殘餘熱能輻射殆盡後，不再發光冷卻形成的最終冷卻天體殘骸。' },
            { id: 31, cat: 'stellar', name: '中子星 (Neutron Star)', tag: '恆星殘骸／緻密星', desc: '大質量恆星經歷超新星爆炸後形成的極高密度殘骸，質量約 1.4 至 3 倍太陽質量，直徑僅約 20 公里，依靠中子簡併壓對抗重力。每立方公分物質重達數億噸。' },
            { id: 32, cat: 'stellar', name: '脈衝星 (Pulsar)', tag: '緻密星特徵', desc: '高速自轉且具備強烈磁場的中子星。其磁極向外發出聚焦的電波、可見光或 X 射線束，當光束隨自轉掃過地球時，會被觀測到極其精確的週期性脈衝。' },
            { id: 33, cat: 'stellar', name: '磁星 (Magnetar)', tag: '緻密星特徵', desc: '一種擁有超強磁場的中子星（磁場強度可達地球磁場的 800 兆倍）。其外殼在強磁場應力下破裂會引發「星震」（Starquake），釋放出巨大的伽瑪射線與 X 射線暴發。' },
            { id: 34, cat: 'stellar', name: '棕矮星 (Brown Dwarf)', tag: '失敗的恆星 / 次恆星天體', desc: '質量介於最大氣態行星與最小恆星之間（約 13 至 80 倍木星質量，或 0.012 至 0.075 倍太陽質量）的天體。核心溫度不足以點燃穩定的質子－質子鏈氫融合，僅能進行短暫的氘融合，被稱為「失敗的恆星」。' },
            { id: 35, cat: 'stellar', name: 'T 金牛座型星 (T Tauri Star)', tag: '恆星演化階段', desc: '中低質量原恆星吸積完大部分物質後、即將進入主序帶之前的演化階段。展現出強烈的恆星風、高速噴流與圍繞在赤道四周的吸積盤。' },
            { id: 36, cat: 'stellar', name: '造父變星 (Cepheid Variables)', tag: '變星類型／標準燭光', desc: '脈動週期在 3 至 50 天之間的黃色脈動超巨星。其脈動週期與真實光度成正比（週光關係），是量測河外星系距離的核心「標準燭光」。' },
            { id: 37, cat: 'stellar', name: 'RR 琴座型變星 (RR Lyrae Variables)', tag: '變星類型／標準燭光', desc: '週期小於 1 天的年老脈動巨星，平均光度約為 50 倍太陽光度。常分布於球狀星團中，被天文學家作為測量銀河系內及近鄰星系距離的標準燈泡。' },
            { id: 38, cat: 'stellar', name: '比鄰星 (Proxima Centauri)', tag: '特定恆星／紅矮星', desc: '距離太陽系最近的恆星（距離約 4.25 光年），屬於 M 型低光度紅矮星，無法用肉眼直接觀測。與半人馬座 α 星 A/B 組成三合星系統。' },
            { id: 39, cat: 'stellar', name: '半人馬座 α 星 (Alpha Centauri A/B)', tag: '特定恆星／聯星系統', desc: '距離太陽系最近的聯星系統（距地球約 4.4 光年），由一顆與太陽極為相似的 G 型主序星（Alpha Centauri A）和一顆 K 型星（Alpha Centauri B）組成。' },
            { id: 40, cat: 'stellar', name: '天狼星 A 與天狼星 B (Sirius A & B)', tag: '特定恆星／聯星系統', desc: '全天肉眼觀測最明亮的主序星天狼星 A（A 型藍白色星，視星等 -1.5），與人類歷史上記錄的第一顆白矮星伴星「天狼星 B」（俗稱「小狗星」，密度高達水的數十萬倍）組成的雙星系統。' },
            { id: 41, cat: 'stellar', name: '織女星 (Vega) 與 牛郎星 (Altair)', tag: '特定恆星', desc: '織女星為琴座 A 型主序星，色指數與光度常被作為光度測量的基準校正星；牛郎星為天鷹座高速自轉星，快速自轉使其赤道隆起呈扁球狀。' },
            { id: 42, cat: 'stellar', name: '參宿四 (Betelgeuse) 與 參宿七 (Rigel)', tag: '特定恆星／獵戶座', desc: '獵戶座兩顆最明亮的亮星。參宿四是一顆處於生命末期的紅超巨星，體積巨大到若置於太陽系中心將吞噬木星軌道；參宿七則是一顆極度明亮的藍超巨星。' },
            { id: 43, cat: 'stellar', name: '北極星 (Polaris)', tag: '特定恆星 / 造父變星', desc: '小熊座最亮星，同時也是一顆脈動振幅逐漸減小的造父變星，週期約為 4 天，長期以來被人類作為夜空導航的定向座標。' },
            { id: 44, cat: 'stellar', name: "巴納德星 (Barnard's Star)", tag: '特定恆星／紅矮星', desc: '全天已知自行速度最大的恆星（每年位移約 10.3 角秒），1916 年由 E. E. 巴納德發現，是一顆距離地球較近的低質量紅矮星。' },
            { id: 45, cat: 'stellar', name: '大陵五 / 惡魔星 (Algol)', tag: '特定恆星／食雙星', desc: '英仙座最著名的食雙星，亮度會週期性因為兩星相互遮擋而變暗，古希臘人將其變化視為「美杜莎的惡魔之眼」。' },
            { id: 46, cat: 'stellar', name: '心宿二 (Antares)', tag: '特定恆星／紅超巨星', desc: '天蠍座核心的紅超巨星，表面溫度較低呈現強烈紅色，周圍環繞著由自身拋射物質組成的反射塵埃雲。' },

            // 🌌 3. 星系、黑洞、星雲與大尺度結構
            { id: 47, cat: 'galaxies', name: '銀河系 (Milky Way Galaxy)', tag: '星系／棒旋星系', desc: '太陽系所在的家鄉星系，屬於棒旋星系。星盤直徑超過 10 萬光年，包含超過 1,000 億顆恆星，太陽約位於距離星系中心約 26,000 光年處的獵戶臂上。' },
            { id: 48, cat: 'galaxies', name: '螺旋星系與橢圓星系', tag: '星系形態分類', desc: '螺旋星系具有中央核球、扁平星盤與旋臂結構，富含氣體與塵埃且新恆星形成活躍；橢圓星系呈圓球或橢球狀，主要由年老紅色恆星組成。' },
            { id: 49, cat: 'galaxies', name: '不規則星系與矮星系', tag: '星系形態分類', desc: '不規則星系缺乏對稱或固定幾何形狀（如大小麥哲倫星雲）；矮星系規模遠小於標準星系，常作為衛星星系被重力吞噬。' },
            { id: 50, cat: 'galaxies', name: '仙女座星系與本星系群', tag: '星系群與鄰近星系', desc: '仙女座星系（M31）是本星系群中規模最大的螺旋星系；本星系群包含銀河系、仙女座及約 60 個矮星系，跨越半徑約 300 萬光年。' },
            { id: 51, cat: 'galaxies', name: '室女座星系團與超星系團', tag: '星系大尺度結構', desc: '室女座星系團包含數千個星系；室女座超星系團與拉尼亞凱亞超星系團則是更高階的宇宙大尺度重力結構。' },
            { id: 52, cat: 'galaxies', name: '宇宙網與空洞 (Cosmic Web)', tag: '大尺度結構', desc: '宇宙中的星系與星系團在超大尺度上交織成類似海綿或蜘蛛網的絲狀結構，其間分布著幾乎沒有星系的巨大黑暗空洞。' },
            { id: 53, cat: 'galaxies', name: '黑洞、事件視界與史瓦西半徑', tag: '緻密天體／極端時空', desc: '重力強大到連光也無法逃脫的天體。事件視界是其單向臨界面邊界，史瓦西半徑決定了其視界大小。' },
            { id: 54, cat: 'galaxies', name: '奇點與義大利麵化', tag: '黑洞物理結構', desc: '奇點是密度無限大、體積為零的點；義大利麵化則是物質靠近黑洞時因極端潮汐力差而被縱向拉長、橫向擠壓的現象。' },
            { id: 55, cat: 'galaxies', name: '吸積盤與超大質量黑洞', tag: '黑洞物理與天體', desc: '氣體與塵埃落入黑洞時形成的旋轉高溫發光盤；超大質量黑洞（如人馬座 A*、M87*、TON 618、天鵝座 X-1）質量可達太陽數十萬至數百億倍。' },
            { id: 56, cat: 'galaxies', name: '星雲 (分子雲、發射、反射、暗、行星狀)', tag: '星雲類型', desc: '分子雲是恆星搖籃；發射與反射星雲展現絢麗光芒；暗星雲阻擋星光；行星狀星雲是晚期膨脹氣體；獵戶座與蟹狀星雲則是著名的星際奇觀。' },
            { id: 57, cat: 'galaxies', name: '類星體 / 活動星系核 (Quasar / AGN)', tag: '極端天體', desc: '早期宇宙中極度明亮的外河外天體，中心超大質量黑洞劇烈吸積物質產生極高光度，釋放出強烈噴流與全波段輻射。' },

            // ⏳ 4. 物理定律、力學與宇宙學
            { id: 58, cat: 'physics', name: "牛頓萬有引力定律 (Newton's Law)", tag: '經典物理定律', desc: '1687 年牛頓提出的定律，指出宇宙中任意兩質點相互吸引，引力大小與質量乘積成正比，與距離平方成反比。' },
            { id: 59, cat: 'physics', name: '四大基本作用力 (Four Fundamental Forces)', tag: '基礎物理學', desc: '主宰宇宙一切交互作用的四種力：重力、電磁力、強核力與弱核力，共同塑造了我們所處的宇宙大尺度與微觀結構。' },
            { id: 60, cat: "physics", name: "克卜勒行星運動三大定律 (Kepler's Laws)", tag: '天體力學定律', desc: '第一定律（橢圓定律）、第二定律（面積定律，近日點快、遠日點慢）與第三定律（週期平方與半長軸立方成正比，P^2 = a^3）。' },
            { id: 61, cat: 'physics', name: '活力公式 (Vis-Viva Equation)', tag: '天體力學公式', desc: '描述天體在軌道上任一點的機械能守恆公式，可用以推導圓軌道速度與逃逸速度。' },
            { id: 62, cat: 'physics', name: '逃逸速度 (Escape Speed)', tag: '天體力學概念', desc: '天體克服某一重力場束縛所需的最小初始速度。地球表面逃逸速度約為 11.2 km/s。' },
            { id: 63, cat: 'physics', name: '軌道根數 (Orbital Elements)', tag: '天體力學參數', desc: '完整描述天體三維克卜勒軌道姿態與位置所需的六個獨立參數（半長軸 a、離心率 e、軌道傾角 i、升交點經度 Ω 等）。' },
            { id: 64, cat: 'physics', name: '霍曼轉移軌道與重力助推', tag: '航天軌道力學', desc: '霍曼轉移是消耗最少燃料的切向橢圓轉移軌道；重力助推則是利用行星重力場借力加速，節省推進燃料。' },
            { id: 65, cat: 'physics', name: '廣義相對論與重力波', tag: '現代物理學與相對論', desc: '愛因斯坦將重力詮釋為時空彎曲的幾何效應；大質量天體加速運動時會產生以光速傳播的微小重力波漣漪。' },
            { id: 66, cat: 'physics', name: '重力透鏡 (Gravitational Lensing)', tag: '相對論現象', desc: '大質量天體（如黑洞、星系團）的強大重力彎曲背景天體發出的光線，造成背景影像放大、扭曲成弧形或產生多重影像的現象。' },
            { id: 67, cat: 'physics', name: '電子簡併壓與錢德拉塞卡極限', tag: '量子物理／恆星演化', desc: '基於包立不相容原理，高密度電子抗衡壓縮的量子力學壓力（支撐白矮星）。白矮星最大質量上限稱為錢德拉塞卡極限（約 1.4 倍太陽質量）。' },
            { id: 68, cat: 'physics', name: '中子簡併壓 (Neutron Degeneracy Pressure)', tag: '量子物理／恆星演化', desc: '當核心質量超過錢德拉塞卡極限，電子與質子結合為中子，由中子產生的量子簡併壓力支撐中子星，抗衡重力塌縮。' },
            { id: 69, cat: 'physics', name: '赫羅圖 (H-R Diagram)', tag: '恆星天文學工具', desc: '以表面溫度為橫軸、絕對光度為縱軸繪製的散布圖，能清晰揭示主序星、巨星、超巨星與白矮星的演化階段，被譽為天文學的元素週期表。' },
            { id: 70, cat: 'physics', name: '視差、秒差距與星等', tag: '天文測量學', desc: '利用地球公轉基線推算距離的三角測量法（1 秒差距約 3.26 光年）；視星等代表肉眼明暗，絕對星等代表 10 秒差距處的真實發光度。' },
            { id: 71, cat: 'physics', name: '都卜勒效應、紅移與哈伯定律', tag: '光譜學與宇宙學', desc: '光譜線因運動或宇宙膨脹而發生藍移或紅移；哈伯定律證明了宇宙空間正在均勻膨脹。' },
            { id: 72, cat: 'physics', name: '暗物質與暗能量', tag: '宇宙學成分', desc: '暗物質透過重力影響星系自轉（佔 26.8%）；暗能量驅使宇宙加速膨脹（佔 68.5%）。涵蓋冷暗物質、WIMPs 與軸子等候選粒子理論。' },
            { id: 73, cat: 'physics', name: '大霹靂、微波背景與宇宙暴脹', tag: '宇宙學創生模型', desc: '宇宙於約 138 億年前從極高溫狀態劇烈膨脹；CMB 是早期光子退耦留下的黑體輻射殘餘輝光（2.725 K）；暴脹則解釋了宇宙的均勻與平坦性。' },
            { id: 74, cat: 'physics', name: '德雷克方程式與費米悖論', tag: '天體生物學', desc: '德雷克方程式估算銀河系中的智慧文明數量；費米悖論則探討「如果宇宙中充滿了外星生命，那麼他們究竟在哪裡？」' },

            // 🔭 5. 觀測儀器、天文台與太空任務
            { id: 75, cat: 'missions', name: '哈伯與韋伯太空望遠鏡', tag: '太空望遠鏡', desc: '哈伯望遠鏡（HST）口徑 2.4 公尺涵蓋紫外與可見光；韋伯望遠鏡（JWST）主鏡 6.5 公尺專攻紅外線，運行於 L2 軌道深空觀測。' },
            { id: 76, cat: 'missions', name: '事件視界望遠鏡 (EHT) 與 LIGO', tag: '地面精密觀測陣列', desc: 'EHT 結合全球電波望遠鏡利用 VLBI 技術拍下黑洞陰影；LIGO 利用雷射干涉成功直接偵測到雙黑洞合併產生的重力波。' },
            { id: 77, cat: 'missions', name: '蓋亞衛星與史隆數位巡天 (SDSS)', tag: '大規模巡天計畫', desc: '蓋亞衛星精確測量超過 10 億顆恆星的三維位置與視差；SDSS 記錄了數億天體與數百萬星系光譜，成功繪製宇宙大尺度結構網格。' },
            { id: 78, cat: 'missions', name: '航海家與帕克太陽探測器', tag: '深空與太陽探測器', desc: '航海家 1 號與 2 號已飛出太陽系進入星際空間，攜帶黃金唱片；帕克太陽探測器則直接穿透日冕實地測量太陽風。' }
        ];

        let currentCategory = 'all';

        function renderWiki(data) {
            const grid = document.getElementById('wikiGrid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-muted); padding: 20px;">沒有找到相關名詞</div>';
                return;
            }
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wiki-card';
                card.onclick = () => showDetail(item);
                card.innerHTML = `
                    <div class="wiki-card-title">${item.name}</div>
                    <div class="wiki-card-tag">${item.tag}</div>
                    <div class="wiki-card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = wikiData.filter(item => {
                const matchCat = currentCategory === 'all' || item.cat === currentCategory;
                const matchQuery = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderWiki(filtered);
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent = item.name;
            document.getElementById('detailBody').innerHTML = `
                <p><b>分類標籤：</b>${item.tag}</p><br>
                <p><b>詳細解析：</b>${item.desc}</p>
            `;
        }

        renderWiki(wikiData);
    </script>
</body>
</html>
