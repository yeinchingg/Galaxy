      .wiki-container {
        margin-top: 84px;

        flex-direction: column;

        padding-right: 4px;

      .category-list::-webkit-scrollbar {

        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;

      .cat-btn {

        border: 1px solid var(--border-color);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        text-align: left;
        transition: all 0.2s;

      .cat-btn:hover,

        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .wiki-content-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .search-box {
        width: 100%;
        padding: 10px 14px;
        background: rgba(3, 7, 18, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.9rem;
        color: #fff;
        outline: none;
        transition: border-color 0.2s;
        flex-shrink: 0;
      }

      .search-box::placeholder {
        color: var(--text-muted);
      }

      .search-box:focus {
        border-color: var(--accent);
      }

      .wiki-grid {
        display: flex;
        /* 彈性卡片排版 */
        flex-wrap: wrap;
        /* 自動換行 */
        gap: 12px;
        /* 卡片間距 */
        overflow-y: auto;
        flex: 1;
        padding-right: 4px;
        align-content: flex-start;
        /* 往上方集中，不上下亂撐開 */
      }

      .wiki-grid::-webkit-scrollbar {
        width: 6px;
      }

      .wiki-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.2s;
        flex: 1 1 calc(50% - 6px);
        /* 預設一排兩個 */
        min-width: 260px;
        height: fit-content;
        /* 高度依內容自適應 */
      }

      .wiki-card:hover {
        border-color: rgba(129, 140, 248, 0.5);
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(129, 140, 248, 0.15);
      }

      .wiki-card-title {
        font-weight: 700;
        font-size: 0.9rem;
        color: #c7d2fe;
        margin-bottom: 4px;
      }

      .wiki-card-tag {

        background: rgba(129, 140, 248, 0.15);
        color: #c7d2fe;
        padding: 2px 6px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 6px;
      }

      .wiki-card-desc {
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .detail-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
        background-color: var(--card-bg);
        backdrop-filter: blur(8px);
      }

      .detail-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 8px;
        flex-shrink: 0;

      .detail-body {
        font-size: 0.92rem;
        color: var(--text-muted);
        line-height: 1.7;
        background: rgba(3, 7, 18, 0.6);
        border: 1px solid var(--border-color);
        padding: 18px;
        border-radius: 8px;
        overflow-y: auto;
        flex: 1;
      }

      .detail-body::-webkit-scrollbar {

      .detail-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);

      .detail-link {

    <!-- 背景星空動畫效果 -->
    <script>
      const canvas = document.getElementById("spaceCanvas");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      for (let i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.2 + 0.05,
        });
      }

      const trailParticles = [];
      window.addEventListener("mousemove", (e) => {
        for (let i = 0; i < 2; i++) {
          trailParticles.push({
            x: e.clientX,
            y: e.clientY,
            radius: Math.random() * 2 + 1,
            alpha: 0.8,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
          });
        }
      });

      function animateSpace() {
        ctx.clearRect(0, 0, width, height);

        ctx.fillStyle = "#ffffff";
        particles.forEach((p) => {
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();

          p.y -= p.speed;
          if (p.y < 0) {
            p.y = height;
            p.x = Math.random() * width;
          }
        });

        for (let i = trailParticles.length - 1; i >= 0; i--) {
          let tp = trailParticles[i];
          ctx.globalAlpha = tp.alpha;
          ctx.fillStyle = "#818cf8";
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, tp.radius, 0, Math.PI * 2);
          ctx.fill();

          tp.x += tp.vx;
          tp.y += tp.vy;
          tp.alpha -= 0.03;

          if (tp.alpha <= 0) {
            trailParticles.splice(i, 1);
          }
        }

        requestAnimationFrame(animateSpace);
      }
      animateSpace();
    </script>

    <!-- 引入資料檔案（依序先放陣列，再放對應 Map） -->
    <script src="wiki_data.js"></script>
    <script src="wiki_map_data.js"></script>

    <!-- 主邏輯與搜尋、詳細解析處理 -->
    <script>
      // 建立 ID 對應表以連結 WIKI_URL_MAP 的豐富資料
      const wikiIdToDetail = {};
      if (typeof WIKI_URL_MAP !== "undefined") {
        Object.keys(WIKI_URL_MAP).forEach((url) => {
          const entry = WIKI_URL_MAP[url];
          if (entry && entry.id) {
            entry.id.split("/").forEach((idPart) => {
              const match = idPart.match(/\d+/);
              if (match) {
                const numId = parseInt(match[0], 10);
                wikiIdToDetail[numId] = Object.assign({ url: url }, entry);
              }
            });
          }
        });
      }

      let currentCategory = "all";

      // 切換分類
      function filterCategory(cat) {
        currentCategory = cat;
        document
          .querySelectorAll(".cat-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
        renderWikiGrid();
      }

      // 模糊搜尋處理
      function handleSearch() {
        renderWikiGrid();
      }

      // 支援模糊搜尋與分類雙重篩選的渲染核心
      function renderWikiGrid() {
        const query = document
          .getElementById("searchBox")
          .value.trim()
          .toLowerCase();
        const grid = document.getElementById("wikiGrid");
        grid.innerHTML = "";

        if (typeof wikiData === "undefined") {
          grid.innerHTML = `<div style="color: red; padding: 20px;">錯誤：找不到 wikiData 資料檔案！</div>`;
          return;
        }

        // 1. 進行模糊過濾與分類篩選
        const scoredResults = wikiData
          .map((item) => {
            const matchCategory =
              currentCategory === "all" || item.cat === currentCategory;
            if (!matchCategory) return { item, score: 0 };

            const targetText = (item.name + item.tag + item.desc).toLowerCase();

            let score = 0;
            let matchedChars = 0;

            if (!query) {
              return { item, score: 100 }; // 沒輸入關鍵字時全數顯示
            }

            // 如果直接包含，給高分
            if (targetText.includes(query)) {
              score += 100;
            }

            // 逐字模糊比對
            for (let char of query) {
              if (targetText.includes(char)) {
                matchedChars++;
              }
            }

            score += (matchedChars / query.length) * 50;
            return { item, score };
          })
          .filter((result) => result.score > 20); // 門檻值

        // 依照分數排序
        scoredResults.sort((a, b) => b.score - a.score);
        const filtered = scoredResults.map((r) => r.item);

        // 2. 如果查不到任何結果，顯示「Google 搜尋引導」
        if (filtered.length === 0) {
          const rawQuery = document.getElementById("searchBox").value.trim();
          const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(rawQuery + " 天文")}`;

          grid.innerHTML = `
          <div style="grid-column: 1 / -1; width: 100%; text-align: center; color: var(--text-muted); padding: 40px; background: rgba(255, 255, 255, 0.02); border: 1px dashed var(--border-color); border-radius: 8px;">
            <p style="margin-bottom: 12px; font-size: 0.95rem;">找不到與 <b>"${rawQuery}"</b> 相關的內部天文詞條。</p>
            <a href="${googleSearchUrl}" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: opacity 0.2s;">
              <span class="material-symbols-outlined" style="font-size: 1.1rem;">search</span>
              前往 Google 搜尋 "${rawQuery}"
            </a>
          </div>
        `;
          return;
        }

        // 3. 有結果時正常渲染卡片
        filtered.forEach((item) => {
          const card = document.createElement("div");
          card.className = "wiki-card";
          card.onclick = () => showDetail(item.id);
          card.innerHTML = `
          <div class="wiki-card-title">${item.name}</div>
          <div class="wiki-card-tag">${item.tag}</div>
          <div class="wiki-card-desc">${item.desc}</div>
        `;
          grid.appendChild(card);
        });
      }

      // 顯示詞條詳細解析（結合 wikiData 與 wikiIdToDetail）
      function showDetail(id) {
        const item = wikiData.find((w) => w.id === id);
        if (!item) return;

        document.getElementById("detailTitle").textContent = item.name;

        let detailHtml = `
        <p><b>分類標籤：</b>${item.tag}</p><br>
        <p>${item.desc}</p>
      `;

        // 嘗試從 WIKI_URL_MAP 抓取額外的參考來源與官方連結
        const detailInfo = wikiIdToDetail[id];
        if (detailInfo && detailInfo.sources) {
          detailHtml += `
          <br><hr style="border-color: var(--border-color); margin: 12px 0;">
          <p><b>參考來源：</b></p>
          <ul style="padding-left: 18px; margin-top: 6px;">
            ${detailInfo.sources.map((src) => `<li>${src}</li>`).join("")}
          </ul>
          ${detailInfo.url ? `<br><a href="${detailInfo.url}" target="_blank" class="detail-link">📖 閱讀官方完整文獻</a>` : ""}
        `;
        }

        document.getElementById("detailBody").innerHTML = detailHtml;
      }

      // 頁面載入時初始化渲染全部
      window.addEventListener("DOMContentLoaded", () => {
        renderWikiGrid();
      });
    </script>
