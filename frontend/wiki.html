    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }

        const trailParticles = [];
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                trailParticles.push({
                    x: e.clientX,
                    y: e.clientY,
                    radius: Math.random() * 2 + 1,
                    alpha: 0.8,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            }
        });

        function animateSpace() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });

            for (let i = trailParticles.length - 1; i >= 0; i--) {
                let tp = trailParticles[i];
                ctx.globalAlpha = tp.alpha;
                ctx.fillStyle = '#818cf8';
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, tp.radius, 0, Math.PI * 2);
                ctx.fill();

                tp.x += tp.vx;
                tp.y += tp.vy;
                tp.alpha -= 0.03;

                if (tp.alpha <= 0) {
                    trailParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateSpace);
        }
        animateSpace();
    </script>

            { id: 2, cat: 'solarsystem', name: '水星 (Mercury)', tag: '太陽系天體／類地行星', desc: '距離太陽最近的類地行星。其軌道半長軸約 0.39 AU，公轉週期僅 88 地球日，平均公轉速度達每秒 48 公里，是太陽系中移動最快的行星。水星沒有大氣層保溫且無天然衛星。' },
            { id: 3, cat: 'solarsystem', name: '金星 (Venus)', tag: '太陽系天體／類地行星', desc: '距離太陽第二近的類地行星，軌道半長軸約 0.72 AU。金星擁有極其濃密且富含二氧化碳的大氣層，產生強烈的溫室效應，表面溫度超過 460 °C。在地球夜空中，金星是除月球外最明亮的天體。' },
            { id: 4, cat: 'solarsystem', name: '地球 (Earth)', tag: '太陽系天體／類地行星', desc: '距離太陽第三近的類地行星，也是目前已知唯一存在生命的天體。地球距離太陽平均為 1 AU，擁有液態水海洋、氮氧大氣層以及由液態外核電流產生的地磁場，能阻擋太陽風高能粒子。' },
            { id: 5, cat: 'solarsystem', name: '月球 (The Moon)', tag: '太陽系天體／天然衛星', desc: '地球唯一的天然衛星。月球繞地球公轉，其潮汐力引發了地球海洋的漲退潮。古人曾利用月球與地球直徑作為三角測量基線來估算天體距離。' },
            { id: 6, cat: 'solarsystem', name: '火星 (Mars)', tag: '太陽系天體／類地行星', desc: '第四顆類地行星，軌道半長軸為 1.52 AU，公轉週期約 1.88 地球年。火星大氣稀薄，表面覆蓋氧化鐵沙塵呈現紅色。軌道與地貌特徵顯示其數十億年前曾擁有更溫暖潮濕的環境與液態水。' },
            { id: 7, cat: 'solarsystem', name: '木星 (Jupiter)', tag: '太陽系天體／氣態巨行星', desc: '太陽系中體積與質量最大的行星，質量為地球的 318 倍。木星主要由氫與氦組成，其與土星的質量加總佔了太陽系非太陽質量的近 90%。木星擁有龐大的衛星系統與微弱的行星環。' },
            { id: 8, cat: 'solarsystem', name: '土星 (Saturn)', tag: '太陽系天體／氣態巨行星', desc: '距離太陽第六近的氣態巨行星，以其極度寬廣且明亮的冰質行星環系統聞名。土星密度小於水，主要成分為氫和氦，擁有土衛六、土衛二等多顆具備天體生物學潛力的衛星。' },
            { id: 9, cat: 'solarsystem', name: '天王星 (Uranus)', tag: '太陽系天體／冰巨行星', desc: '距離太陽第七近的行星，1781 年由威廉·赫歇爾首次透過望遠鏡發現。天王星大氣含有水、氨、甲烷等「冰」成分，自轉軸極度傾斜（幾乎橫躺著公轉）。' },
            { id: 10, cat: 'solarsystem', name: '海王星 (Neptune)', tag: '太陽系天體／冰巨行星', desc: '太陽系八大行星中最外圍的一顆（軌道半長軸約 30 AU），1846 年由加勒根據亞當斯與勒維耶的重力攝動數學計算預測位置後直接發現，是天體力學的重大勝利。' },
            { id: 11, cat: 'solarsystem', name: '穀神星 (Ceres)', tag: '太陽系天體／矮行星', desc: '位於小行星帶中最大的天體，半長軸為 2.77 AU。2006 年國際天文聯合會將其歸類為矮行星，是小行星帶中唯一呈流體靜力平衡（球形）的天體。' },
            { id: 12, cat: 'solarsystem', name: '冥王星 (Pluto)', tag: '太陽系天體／矮行星', desc: '位於柯伊伯帶的冰質矮行星，軌道傾角達 17°。2006 年前曾被列為九大行星之一，後因未能清空軌道周圍天體而被改分類為矮行星。' },
            { id: 13, cat: 'solarsystem', name: '鬩神星 (Eris)', tag: '太陽系天體／矮行星', desc: '位於柯伊伯帶外圍的巨大矮行星，軌道傾角高達 44°。鬩神星的發現促使天文學家重新嚴格定義行星，進而將冥王星與鬩神星一同歸類為矮行星。' },
            { id: 14, cat: 'solarsystem', name: '妊神星與鳥神星 (Haumea & Makemake)', tag: '太陽系天體／矮行星', desc: '兩顆位於海王星軌道外柯伊伯帶的正式登錄矮行星，主要由冰與岩石混合組成。' },
            { id: 15, cat: 'solarsystem', name: '木衛二 歐羅巴 (Europa)', tag: '太陽系天體／木星衛星', desc: '木星的伽利略衛星之一。表面被厚厚的冰層覆蓋，下方因木星強烈潮汐引力加熱，存在一個深達數十至上百公里的全球性液態水海洋，是尋找外星生命的核心目標。' },
            { id: 16, cat: 'solarsystem', name: '木衛一 伊奧與木衛四 卡利斯多', tag: '太陽系天體／木星衛星', desc: '伊奧是太陽系中火山活動最劇烈的天體；卡利斯多則是木星最外圍的伽利略衛星，表面佈滿古老的撞擊坑。' },
            { id: 17, cat: 'solarsystem', name: '土衛六 泰坦 (Titan)', tag: '太陽系天體／土星衛星', desc: '土星最大的衛星，擁有比地球更濃密的氮氣大氣層，表面存在由液態甲烷與乙烷構成的河流、湖泊與沙丘，是研究前生物化學的天然實驗室。' },
            { id: 18, cat: 'solarsystem', name: '土衛二 恩克拉多斯 (Enceladus)', tag: '太陽系天體／土星衛星', desc: '土星的一顆冰質小衛星，南極區域有巨型冰噴泉（羽流），將內部位於冰殼下的液態海洋物質以每秒 250 公里的速度噴射至太空。' },
            { id: 19, cat: 'solarsystem', name: '小行星帶 (Asteroid Belt)', tag: '太陽系大尺度區域', desc: '位於火星與木星軌道之間（約 2.2 至 3.3 AU）的區域，聚集了數十萬顆太陽系形成早期殘留下來的岩質小天體。' },
            { id: 20, cat: 'solarsystem', name: '柯伊伯帶 (Kuiper Belt)', tag: '太陽系大尺度區域', desc: '位於海王星軌道外側（約 30 至 50 AU）的扁平盤狀區域，由大量冰質小天體（如冥王星、鬩神星、短週期彗星）組成。' },
            { id: 21, cat: 'solarsystem', name: '歐特雲 (Oort Cloud)', tag: '太陽系大尺度區域', desc: '理論上包覆整個太陽系的球殼狀彗星儲藏區，延伸範圍達 2,000 至 200,000 AU，是長週期彗星的主要來源。' },
            { id: 22, cat: 'solarsystem', name: '日球層頂 / 太陽圈 (Heliopause)', tag: '太陽系邊界', desc: '由太陽風向外吹送高能等離子體粒子所形成的氣泡狀區域；當太陽風壓力與星際介質達到平衡的交界面稱為日球層頂。' },

            // ⚡ 2. 恆星物理、類型與有名恆星
            { id: 23, cat: 'stellar', name: '恆星 (Star)', tag: '恆星演化階段', desc: '由高溫氣體組成、藉由核心的核融合反應抵抗自身重力塌縮的巨大發光球體。恆星是宇宙中星系的基本組成單位。' },
            { id: 24, cat: 'stellar', name: '原恆星 (Protostar)', tag: '恆星演化階段', desc: '分子雲團塊在自身重力下塌縮生熱、尚未點燃核心氫融合反應前的恆星胚胎階段。' },
            { id: 25, cat: 'stellar', name: '主序星 (Main-Sequence Star)', tag: '恆星演化階段', desc: '恆星一生中最漫長且穩定的青壯年時期（約佔生命的 90%），核心穩定進行氫融合為氦的反應。' },
            { id: 26, cat: 'stellar', name: '次巨星 (Subgiant)', tag: '恆星演化階段', desc: '核心氫燃料耗盡後，恆星離開主序帶、外層大氣開始膨脹且光度上升的過渡階段。' },
            { id: 27, cat: 'stellar', name: '紅巨星 / 巨星 (Red Giant / Giant)', tag: '恆星演化階段', desc: '中低質量恆星核心氫耗盡後膨脹形成的巨型恆星，表面溫度較低而呈現紅色。' },
            { id: 28, cat: 'stellar', name: '紅超巨星 / 超巨星 (Red Supergiant)', tag: '恆星演化階段', desc: '大質量恆星演化晚期的極度膨脹狀態，半徑可達數個天文單位，核心能進行多重元素融合直到生成鐵。' },
            { id: 29, cat: 'stellar', name: '白矮星 (White Dwarf)', tag: '恆星殘骸／緻密星', desc: '中低質量恆星拋散外層後留下的高密度核心殘骸，依靠電子簡併壓抗衡重力。' },
            { id: 30, cat: 'stellar', name: '黑矮星 (Black Dwarf)', tag: '恆星殘骸理論終局', desc: '白矮星將所有內部殘餘熱能輻射殆盡後，不再發光冷卻形成的最終冷卻天體殘骸。' },
            { id: 31, cat: 'stellar', name: '中子星 (Neutron Star)', tag: '恆星殘骸／緻密星', desc: '大質量恆星超新星爆炸後形成的極高密度殘骸，直徑僅約 20 公里，依靠中子簡併壓對抗重力。' },
            { id: 32, cat: 'stellar', name: '脈衝星 (Pulsar)', tag: '緻密星特徵', desc: '高速自轉且具備強烈磁場的中子星，向外發出週期性電波脈衝訊號。' },
            { id: 33, cat: 'stellar', name: '磁星 (Magnetar)', tag: '緻密星特徵', desc: '擁有超強磁場的中子星，外殼破裂引發星震時會釋放巨大伽瑪射線與 X 射線暴發。' },
            { id: 34, cat: 'stellar', name: '棕矮星 (Brown Dwarf)', tag: '失敗的恆星', desc: '質量介於最大氣態行星與最小恆星之間的天體，核心不足以點燃穩定的氫融合。' },
            { id: 35, cat: 'stellar', name: 'T 金牛座型星 (T Tauri Star)', tag: '恆星演化階段', desc: '中低質量原恆星即將進入主序帶之前的演化階段，展現強烈恆星風與吸積盤。' },
            { id: 36, cat: 'stellar', name: '造父變星 (Cepheid Variables)', tag: '變星類型／標準燭光', desc: '脈動週期與真實光度成正比的黃色超巨星，是量測河外星系距離的核心標準燭光。' },
            { id: 37, cat: 'stellar', name: 'RR 琴座型變星 (RR Lyrae Variables)', tag: '變星類型／標準燭光', desc: '週期小於 1 天的年老脈動巨星，常用於測量銀河系內及近鄰星系距離。' },
            { id: 38, cat: 'stellar', name: '比鄰星 (Proxima Centauri)', tag: '特定恆星／紅矮星', desc: '距離太陽系最近的恆星（約 4.25 光年），屬於 M 型低光度紅矮星。' },
            { id: 39, cat: 'stellar', name: '半人馬座 α 星 (Alpha Centauri A/B)', tag: '特定恆星／聯星系統', desc: '距離太陽系最近的聯星系統（約 4.4 光年），包含 G 型與 K 型主序星。' },
            { id: 40, cat: 'stellar', name: '天狼星 A 與天狼星 B', tag: '特定恆星／聯星系統', desc: '全天肉眼最明亮的主序星天狼星 A，與人類歷史首顆發現的白矮星伴星 B 組成。' },
            { id: 41, cat: 'stellar', name: '織女星與牛郎星', tag: '特定恆星', desc: '織女星為琴座 A 型主序星；牛郎星為天鷹座高速自轉星，夏季大三角成員。' },
            { id: 42, cat: 'stellar', name: '參宿四與參宿七', tag: '特定恆星／獵戶座', desc: '獵戶座亮星。參宿四為紅超巨星；參宿七為極度明亮的藍超巨星。' },
            { id: 43, cat: 'stellar', name: '北極星 (Polaris)', tag: '特定恆星 / 造父變星', desc: '小熊座最亮星，同時也是一顆脈動振幅逐漸減小的造父變星。' },
            { id: 44, cat: "stellar", name: "巴納德星 (Barnard's Star)", tag: '特定恆星／紅矮星', desc: '全天已知自行速度最大的恆星，距離地球較近的低質量紅矮星。' },
            { id: 45, cat: 'stellar', name: '大陵五 / 惡魔星 (Algol)', tag: '特定恆星／食雙星', desc: '英仙座最著名的食雙星，亮度會週期性因為兩星相互遮擋而變暗。' },
            { id: 46, cat: 'stellar', name: '心宿二 (Antares)', tag: '特定恆星／紅超巨星', desc: '天蠍座核心的紅超巨星，周圍環繞著自身拋射物質組成的反射塵埃雲。' },

            // 🌌 3. 星系、黑洞、星雲與大尺度結構
            { id: 47, cat: 'galaxies', name: '銀河系 (Milky Way Galaxy)', tag: '星系類型／棒旋星系', desc: '我們太陽系所在的家鄉星系，直徑超過 10 萬光年，包含 2000 億至 4000 億顆恆星，中心擁有超大質量黑洞人馬座 A*。' },
            { id: 48, cat: 'galaxies', name: '螺旋星系 / 棒旋星系', tag: '星系形態分類', desc: '具有中央核球、扁平星盤與旋臂結構的星系，旋臂中富含氣體與塵埃，新恆星形成活躍。' },
            { id: 49, cat: 'galaxies', name: '橢圓星系 (Elliptical Galaxy)', tag: '星系形態分類', desc: '外觀呈圓球或橢球狀的星系，主要由年老紅色的第二星族星組成，內部幾乎沒有氣體與塵埃。' },
            { id: 50, cat: 'galaxies', name: '不規則星系 (Irregular Galaxy)', tag: '星系形態分類', desc: '缺乏對稱或固定幾何形狀的星系，通常質量較小且富含氣體塵埃（如大、小麥哲倫星雲）。' },
            { id: 51, cat: 'galaxies', name: '矮星系 (Dwarf Galaxy)', tag: '星系規模分類', desc: '規模遠小於標準星系的微型星系，常作為大型星系的衛星星系被重力吞噬。' },
            { id: 52, cat: 'galaxies', name: '仙女座星系 (Andromeda / M31)', tag: '特定星系／螺旋星系', desc: '本星系群中規模最大的螺旋星系，距離地球約 250 萬光年，預計在 45 億年後與銀河系碰撞。' },
            { id: 53, cat: 'galaxies', name: '三角座星系 (Triangulum / M33)', tag: '特定星系／螺旋星系', desc: '本星系群中第三大的螺旋星系，規模僅次於仙女座星系與銀河系。' },
            { id: 54, cat: 'galaxies', name: '大麥哲倫星雲 (LMC) 與 小麥哲倫星雲', tag: '特定星系／不規則矮星系', desc: '銀河系最近的兩個不規則伴星系（距離約 16 萬光年），南半球肉眼可見。' },
            { id: 55, cat: 'galaxies', name: '本星系群 (Local Group)', tag: '星系大尺度結構／星系群', desc: '包含銀河系、仙女座星系及約 60 個矮星系的重力束縛星系群。' },
            { id: 56, cat: 'galaxies', name: '室女座星系團與后髮座星系團', tag: '星系大尺度結構／星系團', desc: '室女座星系團包含數千個星系；后髮座星系團距離約 3 億光年，茲威基曾在此首度發現暗物質證據。' },
            { id: 57, cat: 'galaxies', name: '室女座超星系團 與 拉尼亞凱亞超星系團', tag: '星系大尺度結構／超星系團', desc: '本星系群所在的超星系團結構，拉尼亞凱亞為更高階的超星系團。' },
            { id: 58, cat: 'galaxies', name: '宇宙網與空洞 (Cosmic Web & Voids)', tag: '宇宙大尺度結構', desc: '宇宙中的星系與星系團在超大尺度上交織成的絲狀結構，其間分布著巨大黑暗空洞。' },
            { id: 59, cat: 'galaxies', name: '黑洞 (Black Hole)', tag: '緻密天體／極端時空', desc: '大量物質被壓縮至極小空間內所形成的高密度天體，其強大重力使逃逸速度超過光速。' },
            { id: 60, cat: 'galaxies', name: '事件視界 (Event Horizon)', tag: '黑洞結構', desc: '黑洞周圍單向只進不出的臨界面邊界，內部訊號無法傳遞至外部宇宙。' },
            { id: 61, cat: 'galaxies', name: '史瓦西半徑 (Schwarzschild Radius)', tag: '黑洞物理參數', desc: '球對稱無自轉黑洞的事件視界半徑（r_s = 2GM/c^2）。' },
            { id: 62, cat: 'galaxies', name: '奇點 (Singularity)', tag: '黑洞物理結構', desc: '物質在黑洞中心被重力無限壓縮至體積為零、密度無限大的點。' },
            { id: 63, cat: 'galaxies', name: '吸積盤 (Accretion Disk)', tag: '天體物理現象', desc: '氣體與塵埃落入黑洞時因角動量在四周形成的旋轉盤狀結構，摩擦生熱可達數百萬度。' },
            { id: 64, cat: 'galaxies', name: '義大利麵化 (Spaghettification)', tag: '黑洞潮汐力現象', desc: '物體靠近黑洞時因極端潮汐力差而被縱向拉長、橫向擠壓的現象。' },
            { id: 65, cat: 'galaxies', name: '超大質量黑洞 (Supermassive Black Hole)', tag: '黑洞分類', desc: '質量達太陽數十萬倍至數百億倍的巨型黑洞，普遍存在於大型星系核心。' },
            { id: 66, cat: 'galaxies', name: '人馬座 A* (Sagittarius A*)', tag: '特定黑洞／超大質量黑洞', desc: '位於銀河系中心的超大質量黑洞，質量約為 400 萬倍太陽質量。' },

            { id: 302, cat: 'missions', name: '韋伯太空望遠鏡 (JWST)', tag: '太空望遠鏡', desc: '2021 年發射、主鏡口徑 6.5 公尺（18 片鍍金六角形鏡片）的紅外線太空望遠鏡，運行於 L2 軌道，專為觀測早期宇宙高紅移星系與系外行星大氣設計。' },

            { id: 305, cat: 'missions', name: '蓋亞衛星與依巴谷衛星', tag: '測天衛星', desc: '依巴谷衛星首次從太空精確量測數萬恆星視差；蓋亞衛星則精確測量超過 10 億顆恆星的三維位置與視差，繪製銀河系三維地圖。' },

            { id: 311, cat: 'missions', name: 'ALMA 與 甚大天線陣 (VLA)', tag: '地面大型電波望遠鏡陣列', desc: 'ALMA 位於智利高山，擅長觀測原行星盤結構（如 HL Tau）；VLA 位於美國新墨西哥州，用於高解析度電波天體成像。' }
        ];

        let currentCategory = 'all';

        function renderWiki(data) {
            const grid = document.getElementById('wikiGrid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-muted); padding: 20px;">沒有找到相關名詞</div>';
                return;
            }
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wiki-card';
                card.onclick = () => showDetail(item);
                card.innerHTML = `
                    <div class="wiki-card-title">${item.name}</div>
                    <div class="wiki-card-tag">${item.tag}</div>
                    <div class="wiki-card-desc">${item.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = wikiData.filter(item => {
                const matchCat = currentCategory === 'all' || item.cat === currentCategory;
                const matchQuery = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query) || item.tag.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });
            renderWiki(filtered);
        }

        function showDetail(item) {
            document.getElementById('detailTitle').textContent = item.name;

            // 原始的簡易介紹（尚未擴充資料時的預設樣式，保持不變）
            let html = `
                <p><b>分類標籤：</b>${item.tag}</p><br>
                <p><b>詳細解析：</b>${item.desc}</p>
            `;

            // 若此詞條在延伸資料庫中有對應紀錄，額外附加：連結、補充說明、參考來源、相關延伸主題
            const detail = wikiIdToDetail[item.id];
            if (detail) {
                const sourcesHtml = (detail.sources || [])
                    .map(s => `<li>${s}</li>`)
                    .join('');

                const relatedHtml = (detail.relatedTopicName || '')
                    .split('/')
                    .map(t => t.trim())
                    .filter(Boolean)
                    .map(t => `<span class="detail-related-tag">${t}</span>`)
                    .join('');

                html += `
                    <div class="detail-extra">
                        <div class="detail-extra-title">🔗 延伸連結</div>
                        <p><a class="detail-link" href="${detail.url}" target="_blank" rel="noopener noreferrer">${detail.url}</a></p>

                        <div class="detail-extra-title">📖 補充說明</div>
                        <p>${detail.description}</p>

                        <div class="detail-extra-title">📚 參考資料來源</div>
                        <ul class="detail-sources">${sourcesHtml}</ul>

                        <div class="detail-extra-title">🧭 相關延伸主題</div>
                        <div class="detail-related-list">${relatedHtml}</div>
                    </div>
                `;
            }

            document.getElementById('detailBody').innerHTML = html;
        }

        renderWiki(wikiData);
    </script>
