<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入與註冊系統 | 天文與恆星物理專題</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            text-align: center;
        }

        .login-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 16px;
            background: rgba(129, 140, 248, 0.1);
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .tab-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(3, 7, 18, 0.6);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .form-section {
            display: none;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .form-section.active {
            display: flex;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .input-group input {
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .random-group {
            display: flex;
            gap: 8px;
        }

        .random-group input {
            flex: 1;
        }

        .dice-btn {
            background: rgba(129, 140, 248, 0.2);
            border: 1px solid var(--accent);
            color: #c7d2fe;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .dice-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .submit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: opacity 0.2s, transform 0.15s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.78rem;
            margin-top: -4px;
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="spaceCanvas"></canvas>

    <div class="login-card">
        <div class="login-icon">
            <span class="material-symbols-outlined" style="font-size: 36px; color: var(--accent);">person</span>
        </div>
        <div class="login-title">LOGIN & REGISTER</div>
        <div class="login-desc">選擇訪客進入、註冊新帳號或使用既有帳號密碼登入</div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab(event, 'guest')">訪客登入</button>
            <button class="tab-btn" onclick="switchTab(event, 'register')">建立帳號</button>
            <button class="tab-btn" onclick="switchTab(event, 'account')">帳號登入</button>
        </div>

        <div id="tab-guest" class="form-section active">
            <div class="input-group">
                <label>訪客顯示名稱 (可自己輸入或點擊骰子隨機產生)</label>
                <div class="random-group">
                    <input type="text" id="guestNameInput" placeholder="輸入名稱或按骰子">
                    <button class="dice-btn" onclick="rollGuestName()" title="隨機骰子生出代號">🎲</button>
                </div>
            </div>
            <button class="submit-btn" onclick="handleGuestLogin()">以訪客身分進入平台</button>
        </div>

        <div id="tab-register" class="form-section">
            <div class="input-group">
                <label>設定您的使用者名稱</label>
                <input type="text" id="regUsername" placeholder="輸入想使用的名稱">
            </div>
            <div class="input-group">
                <label>設定密碼</label>
                <input type="password" id="regPassword" placeholder="輸入密碼">
            </div>
            <div id="regErrorMsg" class="error-msg"></div>
            <button class="submit-btn" onclick="handleRegister()">註冊並進入系統</button>
        </div>

        <div id="tab-account" class="form-section">
            <div class="input-group">
                <label>研究員帳號 / 用戶名</label>
                <input type="text" id="loginUsername" placeholder="請輸入已註冊帳號">
            </div>
            <div class="input-group">
                <label>存取密碼</label>
                <input type="password" id="loginPassword" placeholder="請輸入密碼">
            </div>
            <div id="loginErrorMsg" class="error-msg"></div>
            <button class="submit-btn" onclick="handleLogin()">登入系統</button>
        </div>
    </div>

    <script src="auth_handler.js"></script>
    <script>
        // 背景星空特效
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.7 + 0.3,
                speed: Math.random() * 0.2 + 0.05
            });
        }
        function animateSpace() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speed;
                if (p.y < 0) {
                    p.y = height;
                    p.x = Math.random() * width;
                }
            });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        // 頁籤切換
        function switchTab(evt, tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }

            const targetSection = document.getElementById('tab-' + tabName);
            if (targetSection) {
                targetSection.classList.add('active');
            }
        }

        // 初始化先幫訪客骰一個預設名稱
        if (typeof rollGuestName === 'function') {
            rollGuestName();
        }
    </script>
</body>

</html>
