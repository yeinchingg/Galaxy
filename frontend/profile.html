    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .profile-container {
        margin-top: 100px;
        width: 100%;
        max-width: 1100px;
        padding: 0 24px 60px 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .profile-header-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .user-info-group {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .user-avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(129, 140, 248, 0.15);
        border: 1px solid rgba(129, 140, 248, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
      }

      .user-details h2 {
        font-size: 1.4rem;
        color: #fff;
        margin-bottom: 4px;
      }

      .user-details p {
        font-size: 0.88rem;
        color: var(--text-muted);
      }

      .logout-btn {
        background: rgba(248, 113, 113, 0.15);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #f87171;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .logout-btn:hover {
        background: rgba(248, 113, 113, 0.28);
      }

      /* 聊天紀錄收合卡片樣式 */
      .chat-history-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .chat-history-header {
        font-size: 1.1rem;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      /* 標題右側的清除按鈕容器 */
      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .chat-history-content {
        margin-top: 16px;
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
        display: none;
        flex-direction: column;
        gap: 12px;
        max-height: 500px;
        overflow-y: auto;
      }

      .chat-history-content.expanded {
        display: flex;
      }

      .chat-item {
        background: rgba(3, 7, 18, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
      }

      .chat-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
      }

      .chat-q {
        color: #c7d2fe;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .chat-a {
        color: var(--text-main);
        font-size: 0.85rem;
        line-height: 1.5;
        white-space: pre-wrap;
        margin-bottom: 4px;
      }

      /* 將「刪除此則」移至單則對話框底部靠右，與時間分開，絕不遮蓋 */
      .chat-footer {
        display: flex;
        justify-content: flex-end;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 8px;
        margin-top: 4px;
      }

      .delete-single-btn {
        background: rgba(248, 113, 113, 0.1);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #f87171;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 6px;
        transition: all 0.2s;
      }

      .delete-single-btn:hover {
        background: rgba(248, 113, 113, 0.25);
      }

      .clear-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 0.78rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .clear-btn:hover {
        border-color: #f87171;
        color: #f87171;
      }
    </style>
  </head>

  <body>

    <div class="profile-container">
      <!-- 用戶基本資料卡片 -->
      <div class="profile-header-card">
        <div class="user-info-group">
          <div class="user-avatar">
            <span
              class="material-symbols-outlined"
              style="font-size: 36px; color: var(--accent)"
              >person</span
            >
          </div>
          <div class="user-details">
            <h2 id="userNameDisplay">載入中...</h2>
            <p id="userTypeDisplay">身分驗證中...</p>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">登出帳號</button>
      </div>

      <!-- AI 聊天紀錄卡片 (預設收合) -->
      <div class="chat-history-card">
        <div class="chat-history-header" onclick="toggleChatHistory()">
          <span>💬 與 AI 助理的歷史對話紀錄 </span>
          <span id="toggleIcon">▼</span>
        </div>
        <div class="chat-history-content" id="chatHistoryContent">
          <div class="action-bar" style="margin-bottom: 8px">
            <button class="clear-btn" onclick="clearAllChatHistory()">
              清除所有對話
            </button>
          </div>
          <div id="chatListContainer">
            <!-- 動態插入聊天紀錄 -->
          </div>
        </div>
      </div>

      <!-- 星海問答測驗紀錄卡片 (預設收合) -->
      <div class="chat-history-card">
        <div class="chat-history-header" onclick="toggleQuizHistory()">
          <span>🧭 星海問答歷史測驗紀錄 </span>
          <span id="quizToggleIcon">▼</span>
        </div>
        <div class="chat-history-content" id="quizHistoryContent">
          <div class="action-bar" style="margin-bottom: 8px">
            <button class="clear-btn" onclick="clearAllQuizHistory()">
              清除所有測驗紀錄
            </button>
          </div>
          <div id="quizListContainer">
            <!-- 動態插入測驗紀錄 -->
          </div>
        </div>
      </div>
    </div>

    <script src="/static/auth.js"></script>
    <script>
      // 背景星空
      const canvas = document.getElementById("spaceCanvas");
      const ctx = canvas.getContext("2d");
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);
      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });
      const particles = [];
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.2 + 0.05,
        });
      }
      function animateSpace() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        particles.forEach((p) => {
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          p.y -= p.speed;
          if (p.y < 0) {
            p.y = height;
            p.x = Math.random() * width;
          }
        });
        requestAnimationFrame(animateSpace);
      }
      animateSpace();

      // 收合與展開切換
      function toggleChatHistory() {
        const content = document.getElementById("chatHistoryContent");
        const icon = document.getElementById("toggleIcon");
        content.classList.toggle("expanded");
        icon.textContent = content.classList.contains("expanded") ? "▲" : "▼";
      }

      function toggleQuizHistory() {
        const content = document.getElementById("quizHistoryContent");
        const icon = document.getElementById("quizToggleIcon");
        content.classList.toggle("expanded");
        icon.textContent = content.classList.contains("expanded") ? "▲" : "▼";
      }

      const API_BASE = window.location.origin;

      // 載入用戶資料與 AI 聊天紀錄
      // 【修正】改讀 auth.js 實際寫入的 "astro_current_user"（原本讀的
      // "astro_user_session" 這個 key 根本沒有任何地方會寫入，所以名稱
      // 永遠停在「載入中...」）。聊天紀錄也改成向後端資料庫查詢，並依照
      // 目前登入者的 user_id 過濾，不同帳號登入才會看到各自的紀錄。
      async function loadProfileData() {
        const user = getCurrentUser();
        if (user) {
          document.getElementById("userNameDisplay").textContent =
            user.username;
          document.getElementById("userTypeDisplay").textContent =
            `帳號類型：${user.role === "guest" ? "訪客" : "註冊會員"} | 登入時間：${new Date(user.loginTime).toLocaleString()}`;
        } else {
          document.getElementById("userNameDisplay").textContent = "未知用戶";
          document.getElementById("userTypeDisplay").textContent = "尚未登入";
        }

        await renderChatHistory();
        await renderQuizHistory();
      }

      function currentUserId() {
        const user = getCurrentUser();
        return user && user.user_id ? user.user_id : 1;
      }

      async function renderChatHistory() {
        const container = document.getElementById("chatListContainer");
        container.innerHTML = '<div class="empty-chat">載入中...</div>';

        let messages = [];
        try {
          const res = await fetch(
            `${API_BASE}/api/chat/history?user_id=${currentUserId()}`,
          );
          messages = await res.json();
        } catch (e) {
          console.error("讀取聊天紀錄失敗", e);
          container.innerHTML =
            '<div class="empty-chat">讀取聊天紀錄失敗，請確認伺服器是否已啟動</div>';
          return;
        }

        // 後端存的是逐則 user/assistant 訊息，這裡兩兩配對成一組 Q&A 方便顯示
        const pairs = [];
        for (let i = 0; i < messages.length; i++) {
          if (messages[i].role === "user") {
            const answerMsg =
              messages[i + 1] && messages[i + 1].role === "assistant"
                ? messages[i + 1]
                : null;
            pairs.push({
              questionId: messages[i].id,
              answerId: answerMsg ? answerMsg.id : null,
              question: messages[i].content,
              answer: answerMsg ? answerMsg.content : "",
              time: messages[i].ts,
            });
            if (answerMsg) i++;
          }
        }

        if (pairs.length === 0) {
          container.innerHTML =
            '<div class="empty-chat">目前尚無與 AI 的對話紀錄（可在實驗室中與 AI 互動）</div>';
          return;
        }

        container.innerHTML = "";
        pairs
          .slice()
          .reverse()
          .forEach((item) => {
            const div = document.createElement("div");
            div.className = "chat-item";
            div.innerHTML = `
                    <div class="chat-meta">
                        <span>${escapeHtml(item.time)}</span>
                    </div>
                    <div class="chat-q">Q: ${escapeHtml(item.question)}</div>
                    <div class="chat-a">A: ${escapeHtml(item.answer)}</div>
                    <div class="chat-footer">
                        <button class="delete-single-btn" onclick="deleteSingleChat(${item.questionId})">刪除此則</button>
                    </div>
                `;
            container.appendChild(div);
          });
      }

      async function deleteSingleChat(messageId) {
        try {
          await fetch(
            `${API_BASE}/api/chat/message/${messageId}?user_id=${currentUserId()}`,
            {
              method: "DELETE",
            },
          );
        } catch (e) {
          console.error("刪除失敗", e);
        }
        renderChatHistory();
      }

      async function clearAllChatHistory() {
        if (confirm("確定要清除所有與 AI 的聊天紀錄嗎？")) {
          try {
            await fetch(
              `${API_BASE}/api/chat/history?user_id=${currentUserId()}`,
              {
                method: "DELETE",
              },
            );
          } catch (e) {
            console.error("清除失敗", e);
          }
          renderChatHistory();
        }
      }

      // ---- 星海問答測驗紀錄 ----
      async function renderQuizHistory() {
        const container = document.getElementById("quizListContainer");
        container.innerHTML = '<div class="empty-chat">載入中...</div>';

        let scores = [];
        try {
          const res = await fetch(
            `${API_BASE}/api/quiz/history/${currentUserId()}`,
          );
          scores = await res.json();
        } catch (e) {
          console.error("讀取測驗紀錄失敗", e);
          container.innerHTML =
            '<div class="empty-chat">讀取測驗紀錄失敗，請確認伺服器是否已啟動</div>';
          return;
        }

        if (!Array.isArray(scores) || scores.length === 0) {
          container.innerHTML =
            '<div class="empty-chat">目前尚無測驗紀錄（可在星海問答中挑戰關卡）</div>';
          return;
        }

        container.innerHTML = "";
        scores.forEach((item) => {
          // 【修正】quiz.html 的 score 其實是「滿分 100 分制」的分數
          // （每題配分 = 100 / 題數），不是答對題數，所以不能直接拿
          // score ÷ total_questions 當正確率，那樣分母分子單位對不上，
          // 會算出離譜的百分比（例如答對 1 題卻顯示 100%）。
          // score 本身就已經等同「正確率」，答對題數則要反推回來。
          const accuracy = Math.round(item.score);
          const correctCount = item.total_questions
            ? Math.round((item.score / 100) * item.total_questions)
            : 0;
          const div = document.createElement("div");
          div.className = "chat-item";
          div.innerHTML = `
                    <div class="chat-meta">
                        <span>${escapeHtml(item.completed_at)}</span>
                    </div>
                    <div class="chat-q">關卡：${escapeHtml(item.quiz_type)}</div>
                    <div class="chat-a">答對：${correctCount} ／ ${item.total_questions} 題（正確率 ${accuracy}%，得分 ${Math.round(item.score)} 分）</div>
                    <div class="chat-footer">
                        <button class="delete-single-btn" onclick="deleteSingleQuiz(${item.score_id})">刪除此則</button>
                    </div>
                `;
          container.appendChild(div);
        });
      }

      async function deleteSingleQuiz(scoreId) {
        try {
          await fetch(
            `${API_BASE}/api/quiz/score/${scoreId}?user_id=${currentUserId()}`,
            {
              method: "DELETE",
            },
          );
        } catch (e) {
          console.error("刪除失敗", e);
        }
        renderQuizHistory();
      }

      async function clearAllQuizHistory() {
        if (confirm("確定要清除所有測驗紀錄嗎？")) {
          try {
            await fetch(`${API_BASE}/api/quiz/history/${currentUserId()}`, {
              method: "DELETE",
            });
          } catch (e) {
            console.error("清除失敗", e);
          }
          renderQuizHistory();
        }
      }

      function escapeHtml(text) {
        if (!text) return "";
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      window.addEventListener("DOMContentLoaded", loadProfileData);
    </script>
  </body>
